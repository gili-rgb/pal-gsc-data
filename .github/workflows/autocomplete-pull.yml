name: Autocomplete Pull

# קציר Google Autocomplete שבועי — ביקוש בלתי נראה (שאילתות שאינן ב-GSC).
# אין צורך במפתח API.

on:
  schedule:
    - cron: '30 5 * * 1'      # שני 05:30 UTC — אחרי ה-Bing pull
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autocomplete-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0        # נדרש ל-rebase מול main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run autocomplete pull
        env:
          AC_OUT_DIR: cats
        run: python autocomplete_pull.py

      - name: Sanity check
        run: |
          test -s cats/autocomplete_customer_language.md
          grep -q "CSB"   cats/autocomplete_customer_language.md
          grep -q "Marom" cats/autocomplete_customer_language.md
          grep -q "Plrom" cats/autocomplete_customer_language.md

      - name: Commit & push (רק אם השתנה)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add cats/autocomplete_customer_language.md
          git diff --staged --quiet && echo "אין שינוי" && exit 0
          git commit -m "Autocomplete pull (automated) $(date -u +%Y-%m-%d)"
          # הריצה נמשכת דקות ובינתיים יכול להיכנס commit אחר ל-main.
          # בלי rebase ה-push נדחה וכל התוצאה נזרקת (נצפה 2026-08-06).
          for i in 1 2 3 4 5; do
            if git push 2>/tmp/pusherr; then echo "נדחף בניסיון $i"; exit 0; fi
            cat /tmp/pusherr
            # rebase פותר רק התנגשות ("fetch first"). כלל ענף, הגנת סודות
            # או הרשאה חסרה אינם ברי-תיקון בלולאה — ניסיון חוזר רק מבלבל.
            if grep -qi "rule violation\|protected branch\|push protection\|permission to" /tmp/pusherr; then
              echo "::error::ה-push נדחה מסיבה שאינה התנגשות. בדוק Settings → Rules"
              exit 1
            fi
            echo "push נדחה על התנגשות, מבצע rebase (ניסיון $i)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 5))
          done
          echo "::error::push נכשל אחרי 5 ניסיונות"
          exit 1
