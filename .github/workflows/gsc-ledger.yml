name: GSC Ledger Performance

# הצלבת content-ledger.md (Pal-state) מול GSC — before/after לכל מאמר שפורסם.
# דורש secret בשם GSC_SA_JSON: התוכן המלא של קובץ ה-service account JSON
# (pal-gsc-reader@pal-gsc.iam.gserviceaccount.com).

on:
  schedule:
    - cron: '0 6 * * 1'       # שני 06:00 UTC — אחרי שני ה-pulls האחרים
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gsc-ledger
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0        # נדרש ל-rebase מול main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests google-api-python-client google-auth

      - name: Run ledger performance
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          LP_OUT_DIR: cats
        run: python ledger_performance.py

      - name: Sanity check
        run: test -s cats/ledger-performance.md

      - name: Commit & push (רק אם השתנה)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add cats/ledger-performance.md
          git diff --staged --quiet && echo "אין שינוי" && exit 0
          git commit -m "Ledger performance (automated) $(date -u +%Y-%m-%d)"
          # הריצה נמשכת דקות ובינתיים יכול להיכנס commit אחר ל-main.
          # בלי rebase ה-push נדחה וכל התוצאה נזרקת (נצפה 2026-08-06).
          for i in 1 2 3 4 5; do
            if git push 2>/tmp/pusherr; then echo "נדחף בניסיון $i"; exit 0; fi
            cat /tmp/pusherr
            # rebase פותר רק התנגשות ("fetch first"). כלל ענף, הגנת סודות
            # או הרשאה חסרה אינם ברי-תיקון בלולאה — ניסיון חוזר רק מבלבל.
            if grep -qi "rule violation\|protected branch\|push protection\|permission to" /tmp/pusherr; then
              echo "::error::ה-push נדחה מסיבה שאינה התנגשות. בדוק Settings → Rules"
              exit 1
            fi
            echo "push נדחה על התנגשות, מבצע rebase (ניסיון $i)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 5))
          done
          echo "::error::push נכשל אחרי 5 ניסיונות"
          exit 1
