name: GSC Page Queries

# מיפוי URL ← שאילתות אמיתיות, לגיבוי עמודת "שאילתות יעד" ב-content-ledger.
# משתמש באותו secret של gsc-ledger.yml: GSC_SA_JSON.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'       # שני 06:30 UTC — אחרי gsc-ledger

permissions:
  contents: write

concurrency:
  group: gsc-page-queries
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install google-api-python-client google-auth httplib2

      - name: Run page+query pull
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          LP_OUT_DIR: cats
        run: python gsc_page_queries.py

      - name: Sanity check
        run: test -s cats/ledger_target_queries.md

      - name: Commit & push (רק אם השתנה)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cats/ledger_target_queries.md cats/*_page_queries.json
          git diff --staged --quiet || git commit -m "GSC page+query map (automated) $(date -u +%Y-%m-%d)"
          git push
