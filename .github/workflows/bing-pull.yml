name: Bing Webmaster Pull

# משיכת נתוני Bing Webmaster תקופתית ודחיפת bing_customer_language.md ל-repo.
# הסקריפט bing_pull.py רץ as-is — קורא BING_API_KEY מ-env, אין תלות בתיקוני sandbox.

on:
  schedule:
    - cron: '0 5 * * 1'      # כל יום שני 05:00 UTC (~07:00–08:00 ישראל). ליומי: '0 5 * * *'
  workflow_dispatch:          # הרצה ידנית מלשונית Actions (לבדיקה ראשונית)

permissions:
  contents: write             # דרוש כדי לדחוף את הפלט חזרה ל-repo

concurrency:
  group: bing-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0        # נדרש ל-rebase מול main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run Bing pull
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BING_OUT_DIR: cats          # כותב ל-repo/cats — איפה ש-content-machine שלב 0 קורא
        run: python bing_pull.py

      - name: Sanity check (פלט תקין לפני commit)
        run: |
          test -s cats/bing_customer_language.md
          grep -q "CSB"   cats/bing_customer_language.md
          grep -q "Marom" cats/bing_customer_language.md
          grep -q "Plrom" cats/bing_customer_language.md
          # הגנת רגרסיה: מיקום מותג חייב להיות שפוי (לא 0.x מחלוקת-10 שגויה)
          ! grep -E "^\| (csb|מרום|פלרום) \| .* \| 0\." cats/bing_customer_language.md

      - name: Commit & push (רק md, רק אם השתנה)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add cats/bing_customer_language.md
          git diff --staged --quiet && echo "אין שינוי" && exit 0
          git commit -m "Bing pull (automated) $(date -u +%Y-%m-%d)"
          # הריצה נמשכת דקות ובינתיים יכול להיכנס commit אחר ל-main.
          # בלי rebase ה-push נדחה וכל התוצאה נזרקת (נצפה 2026-08-06).
          for i in 1 2 3 4 5; do
            if git push 2>/tmp/pusherr; then echo "נדחף בניסיון $i"; exit 0; fi
            cat /tmp/pusherr
            # rebase פותר רק התנגשות ("fetch first"). כלל ענף, הגנת סודות
            # או הרשאה חסרה אינם ברי-תיקון בלולאה — ניסיון חוזר רק מבלבל.
            if grep -qi "rule violation\|protected branch\|push protection\|permission to" /tmp/pusherr; then
              echo "::error::ה-push נדחה מסיבה שאינה התנגשות. בדוק Settings → Rules"
              exit 1
            fi
            echo "push נדחה על התנגשות, מבצע rebase (ניסיון $i)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 5))
          done
          echo "::error::push נכשל אחרי 5 ניסיונות"
          exit 1
